<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鸣潮 - 角色关系网络图</title>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.6/standalone/umd/vis-network.min.js"></script>
<style>
:root{--bg:#0a0c14;--panel-bg:#111422;--text:#c8d0e0;--accent:#4a9eff;--gold:#d4a853;--border:#1e2130;--hover:#1a1d30}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",sans-serif;height:100vh;overflow:hidden;display:flex}
.sidebar{width:370px;min-width:370px;background:var(--panel-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:10;transition:transform 0.3s}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border);text-align:center}
.sidebar-header h1{font-size:1.6em;background:linear-gradient(135deg,#d4a853,#e8c97a,#d4a853);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:5px}
.sidebar-header .subtitle{font-size:0.8em;color:#6b7084;margin-top:2px}
.search-box{margin:12px 16px;position:relative}
.search-box input{width:100%;padding:10px 36px 10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:0.9em;outline:none;transition:border-color 0.2s}
.search-box input:focus{border-color:var(--accent)}
.search-box .search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#6b7084;pointer-events:none}
.char-info{flex:1;overflow-y:auto;padding:16px}
.char-info .placeholder{text-align:center;color:#4b5060;margin-top:60px;font-size:0.9em;line-height:2}
.card{animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card .name{font-size:1.4em;font-weight:bold;margin-bottom:2px}
.card .title-line{font-size:0.82em;color:#6b7084;margin-bottom:8px}
.card .tags{margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px}
.card .tags span{display:inline-block;padding:2px 10px;border-radius:12px;font-size:0.7em;border:1px solid}
.card .desc{font-size:0.85em;line-height:1.7;color:#a0a8c0;margin-bottom:14px}
.card h4{font-size:0.85em;color:#8b90a0;margin-bottom:6px;letter-spacing:2px}
.card .relation-list{list-style:none}
.card .relation-list li{display:flex;align-items:center;gap:8px;padding:6px 10px;margin:3px 0;border-radius:6px;background:var(--bg);font-size:0.85em;cursor:pointer;transition:background 0.2s}
.card .relation-list li:hover{background:var(--hover)}
.card .relation-list .rel-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.card .relation-list .rel-type{font-size:0.72em;color:#6b7084;margin-left:auto;flex-shrink:0}
.legend{padding:10px 16px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:5px;max-height:100px;overflow-y:auto}
.legend-item{display:flex;align-items:center;gap:4px;font-size:0.67em;color:#8b90a0}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.graph-area{flex:1;position:relative}
#mynetwork{width:100%;height:100%;background:var(--bg)}
.mobile-toggle{display:none;position:absolute;top:12px;left:12px;z-index:20;background:var(--panel-bg);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:0.9em}
.reset-btn{position:absolute;bottom:20px;right:20px;z-index:10;background:var(--panel-bg);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:0.85em;transition:background 0.2s}
.reset-btn:hover{background:var(--hover)}
@media(max-width:768px){
.sidebar{position:absolute;left:0;top:0;bottom:0;transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.mobile-toggle{display:flex!important}
}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
<div class="sidebar-header">
<h1>鸣 潮</h1>
<div class="subtitle">Wuthering Waves · 角色关系网络</div>
<div style="font-size:0.7em;color:#4b5060;margin-top:4px" id="charCount">共收录 — 个节点 · — 条关系</div>
</div>
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索角色…" />
<span class="search-icon">&#128269;</span>
</div>
<div class="char-info" id="charInfo">
<div class="placeholder" id="placeholder">
<div style="font-size:2em;margin-bottom:8px">&#127917;</div>
<div>点击角色节点查看关系详情</div>
<div style="font-size:0.72em;margin-top:8px;color:#3b4050">拖拽移动 · 滚轮缩放 · 双击聚焦</div>
</div>
</div>
<div class="legend" id="legend"></div>
</div>

<div class="graph-area">
<button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776; 菜单</button>
<div id="mynetwork"></div>
<button class="reset-btn" onclick="resetNetwork()">&#8634; 重置视图</button>
</div>

<script>
// ==================== 角色数据（按版本和阵营整理） ====================
const characters = [
  // === 主角 ===
  {id:"漂泊者",label:"漂泊者",group:"主角",title:"御者·群星的调律者·黑海岸缔造者·星炬学院前辈",desc:"本作主角，身世成谜的高维旅人。曾建立黑海岸组织，舍弃记忆后在世界各地漂泊。先后游历瑝珑、黎那汐塔、拉海洛。与守岸人命运相连，曾救下并抚养爱弥斯，曾失约于弗洛洛。千咲称其为前辈，尤诺视其为唯一记得自己之人。",element:"衍射/湮灭/气动",weapon:"迅刀",rarity:"5★",ver:"1.0"},
  // === 瑝珑·今州 (1.0~1.4) ===
  {id:"秧秧",label:"秧秧",group:"瑝珑今州",title:"今州巡尉·漂泊者引路人",desc:"漂泊者苏醒后遇见的第一位伙伴。温柔善良，一路陪伴漂泊者开启最初旅程，是鸣潮的看板娘。",element:"气动",weapon:"迅刀",rarity:"4★",ver:"1.0"},
  {id:"炽霞",label:"炽霞",group:"瑝珑今州",title:"今州巡尉·天城移民",desc:"热情坦率的外放型伙伴，爱吃辣说方言。从小受英雄戏剧和父亲影响立志成为英雄。在漂泊者苏醒后与秧秧一起陪伴冒险。",element:"热熔",weapon:"佩枪",rarity:"4★",ver:"1.0"},
  {id:"白芷",label:"白芷",group:"瑝珑今州",title:"华胥研究院·考古学家",desc:"华胥研究院所属冰山美人考古学家，性格理性冷淡。与残响生物'忧昙'共生，曾在危机中失去对人的信任。",element:"冷凝",weapon:"音感仪",rarity:"4★",ver:"1.0"},
  {id:"散华",label:"散华",group:"瑝珑今州",title:"今汐贴身近卫",desc:"今汐的贴身护卫，冷凝属性剑士。表面接待来访宾客，暗中处理不法之徒，是今汐最信赖之人。",element:"冷凝",weapon:"迅刀",rarity:"4★",ver:"1.0"},
  {id:"桃祈",label:"桃祈",group:"瑝珑今州",title:"天工部事务长",desc:"今州天工部事务长，负责城防建设。以防御力见长，沉稳可靠的指挥官，与忌炎同为今汐核心下属。",element:"湮灭",weapon:"长刃",rarity:"4★",ver:"1.0"},
  {id:"丹瑾",label:"丹瑾",group:"瑝珑今州",title:"流浪剑客",desc:"独立流浪剑客，高风险高回报的战斗风格。性格坚韧独立，多次与漂泊者并肩作战。",element:"湮灭",weapon:"迅刀",rarity:"4★",ver:"1.0"},
  {id:"渊武",label:"渊武",group:"瑝珑今州",title:"武学大师",desc:"沉稳武学大师，蓝色调展现沉静优雅气质。电属性臂铠使用者，可生成雷池强化队友。",element:"导电",weapon:"臂铠",rarity:"4★",ver:"1.0"},
  {id:"鉴心",label:"鉴心",group:"瑝珑今州",title:"修道者",desc:"修行道士，追求内心平静与武道极致。拥有格挡反击机制和自我治疗能力，与漂泊者在旅途中相遇。",element:"气动",weapon:"臂铠",rarity:"5★",ver:"1.0"},
  {id:"凌阳",label:"凌阳",group:"瑝珑今州",title:"舞狮少年",desc:"今州舞狮团成员，活力四射的冷凝臂铠使用者。每年'狻猊巡岁'才正式'醒狮'表演。",element:"冷凝",weapon:"臂铠",rarity:"5★",ver:"1.0"},
  {id:"维里奈",label:"维里奈",group:"瑝珑今州",title:"植物学家·顶级辅助",desc:"热爱植物的温柔少女，游戏顶级通用辅助。光合作用能量可治疗队友并提供15%全队伤害增益。",element:"衍射",weapon:"音感仪",rarity:"5★",ver:"1.0"},
  {id:"莫特斐",label:"莫特斐",group:"瑝珑今州",title:"华胥研究院·研究员",desc:"华胥研究院才华横溢的研究员。擅长重击增益，为忌炎等重击核心角色提供强力辅助。帮助漂泊者解读信物。",element:"热熔",weapon:"佩枪",rarity:"4★",ver:"1.0"},
  {id:"忌炎",label:"忌炎",group:"瑝珑今州",title:"夜归将军",desc:"今州夜归军将军。弯刀之役带领部队突围，主导夜归军改制。与无冠者多次交战，是今州军方核心。",element:"气动",weapon:"长刃",rarity:"5★",ver:"1.0"},
  {id:"吟霖",label:"吟霖",group:"瑝珑今州",title:"前安全部特工",desc:"前今州安全部成员，电属性音感仪使用者。操控人偶战斗，后台协同攻击出色。与漂泊者多次合作执行任务。",element:"导电",weapon:"音感仪",rarity:"5★",ver:"1.0"},
  {id:"今汐",label:"今汐",group:"瑝珑今州",title:"今州令尹·角的共鸣者",desc:"今州令尹，青龙岁主'角'的共鸣者。幼时被角复活抚养，拜长离为师。掌握时序之力，首位对漂泊者展现深厚感情的角色。",element:"衍射",weapon:"长刃",rarity:"5★",ver:"1.1"},
  {id:"长离",label:"长离",group:"瑝珑今州",title:"今汐恩师·漂泊者战友",desc:"今汐的恩师与顾问。实力深不可测，弯刀之役后辅佐今汐重振今州。与漂泊者结下深厚战友情，合轴体系核心。",element:"热熔",weapon:"迅刀",rarity:"5★",ver:"1.1"},
  {id:"相里要",label:"相里要",group:"瑝珑今州",title:"华胥研究院·幕僚",desc:"华胥研究院免费五星DPS。擅长连招与范围伤害，共鸣解放后进入强化状态。月树屋幕后英雄。",element:"导电",weapon:"臂铠",rarity:"5★",ver:"1.2"},
  {id:"折枝",label:"折枝",group:"瑝珑今州",title:"持续伤害输出",desc:"冷凝音感仪使用者，专注持续伤害。通过普攻与变奏积攒共鸣赋能，召唤幻象印记进行强力攻击。",element:"冷凝",weapon:"音感仪",rarity:"5★",ver:"1.2"},
  {id:"釉瑚",label:"釉瑚",group:"瑝珑今州",title:"冰系协同辅助",desc:"四星冷凝治疗角色，风格古怪随机。提供长达28秒的协同攻击伤害增益，是协同攻击队伍的强力辅助。",element:"冷凝",weapon:"臂铠",rarity:"4★",ver:"1.3"},
  {id:"灯灯",label:"灯灯",group:"瑝珑今州",title:"双形态辅助",desc:"瑝珑四星角色，1.4版本加入。拥有独特的双形态切换机制，可为队伍提供灵活的战斗支援。",element:"导电",weapon:"长刃",rarity:"4★",ver:"1.4"},
  // === 黑海岸 (1.3~1.4) ===
  {id:"守岸人",label:"守岸人",group:"黑海岸",title:"黑海岸守护者·漂泊者的命运共同体",desc:"黑海岸灵魂人物，因漂泊者唤醒而生。在无数次轮回中始终等待漂泊者归来。曾将最高权限交予漂泊者，被玩家称为'官方老婆'。使用泰缇斯系统力量进行支援与治疗。",element:"衍射",weapon:"音感仪",rarity:"5★",ver:"1.3"},
  {id:"椿",label:"椿",group:"黑海岸",title:"黑海岸之花·命定之种",desc:"黑海岸执行者，被漂泊者赠予象征身份的'黑花'。在'藤蔓'与'超级藤蔓'形态间切换，擅长空中战斗与AoE伤害。",element:"湮灭",weapon:"迅刀",rarity:"5★",ver:"1.4"},
  {id:"秋水",label:"秋水",group:"黑海岸",title:"黑海岸执花·情报商",desc:"黑海岸所属气动佩枪使用者，同时也是神秘的流浪情报商人。机动性极强，为漂泊者提供关键情报。",element:"气动",weapon:"佩枪",rarity:"4★",ver:"1.0"},
  {id:"卜灵",label:"卜灵",group:"黑海岸",title:"黑海岸·电系万能辅助",desc:"黑海岸所属四星电属性音感仪使用者。让队伍构筑更便宜灵活，降低对昂贵五星辅助的依赖，大幅拓展实用编队选择。",element:"导电",weapon:"音感仪",rarity:"4★",ver:"2.8"},
  {id:"安可",label:"安可",group:"黑海岸",title:"黑海岸客卿·小冒险家",desc:"黑海岸客卿，活泼开朗的小女孩。天真可爱但实力不俗，与漂泊者建立深厚友谊。",element:"热熔",weapon:"音感仪",rarity:"5★",ver:"1.0"},
  // === 黎那汐塔 (2.0~2.8) ===
  {id:"珂莱塔",label:"珂莱塔",group:"黎那汐塔",title:"莫塔里家族二小姐",desc:"黎那汐塔莫塔里家族贵族小姐。战斗中手枪与霰弹枪切换，对漂泊者表现出特殊亲近，昵称漂泊者为'猫眼石'。在狂欢节事件中与漂泊者深入合作揭露神明真相。",element:"冷凝",weapon:"佩枪",rarity:"5★",ver:"2.0"},
  {id:"洛可可",label:"洛可可",group:"黎那汐塔",title:"愚人剧团·湮灭辅助",desc:"愚人剧团成员，强力湮灭辅助。及时援助漂泊者对抗叹息古龙。群控涡旋聚拢敌人，与椿等湮灭DPS协同极佳。",element:"湮灭",weapon:"臂铠",rarity:"5★",ver:"2.0"},
  {id:"菲比",label:"菲比",group:"黎那汐塔",title:"拉古那修会教士",desc:"拉古那修会教士，引导漂泊者进入声骸之城。拥有'赦免'与'告解'双形态。协助漂泊者调查溯海之鲸与'海妖'真相。",element:"衍射",weapon:"音感仪",rarity:"5★",ver:"2.1"},
  {id:"布兰特",label:"布兰特",group:"黎那汐塔",title:"愚人剧团团长·裴魁德号船长",desc:"黎那汐塔愚人剧团团长，浪漫洒脱。舞台之上为故事更换面具，舞台之下只凭一颗真心。同时也是裴魁德号船长，热熔迅刀使用者，盾奶副C兼主C。与洛可可(剧团副手)搭档默契。",element:"热熔",weapon:"迅刀",rarity:"5★",ver:"2.1"},
  {id:"坎特蕾拉",label:"坎特蕾拉",group:"黎那汐塔",title:"翡萨烈家主·海洋守护者",desc:"翡萨烈家族家主，湮灭治疗与协同攻击角色。与漂泊者一同前往阿维纽林神学院寻找卡提希娅，与弗洛洛和洛可可有强力湮灭协同。",element:"湮灭",weapon:"音感仪",rarity:"5★",ver:"2.2"},
  {id:"赞妮",label:"赞妮",group:"黎那汐塔",title:"炼狱战士·光噪主C",desc:"衍射长刃使用者，在常态与'炼狱'模式间切换。擅长格挡，高技巧玩法。与菲比有强力光噪协同。",element:"衍射",weapon:"长刃",rarity:"5★",ver:"2.3"},
  {id:"夏空",label:"夏空",group:"黎那汐塔",title:"吟游诗人",desc:"第一位可玩吟游诗人，气动佩枪使用者。在侵蚀/风蚀队伍中提供强力辅助，引入独特分身机制提升队友箭矢伤害。",element:"气动",weapon:"佩枪",rarity:"5★",ver:"2.3"},
  {id:"卡提希娅",label:"卡提希娅",group:"黎那汐塔",title:"圣女·鸣式创造的生命",desc:"殉道圣女，实为鸣式创造的生命。拥有'卡提亚'与变身形态'Flirtilis'。最终选择自我觉醒否定宿命论，与漂泊者并肩作战后消失在时间中。",element:"气动",weapon:"迅刀",rarity:"5★",ver:"2.4"},
  {id:"露帕",label:"露帕",group:"黎那汐塔",title:"七丘角斗士·漂泊者搭档",desc:"七丘天才角斗士，与漂泊者搭档夺得大角斗赛冠军。在与鸣式海之女的战斗中取回失去记忆，为七丘夺回和平。",element:"热熔",weapon:"长刃",rarity:"5★",ver:"2.4"},
  {id:"弗洛洛",label:"弗洛洛",group:"黎那汐塔",title:"前残星会会监·漂泊者失约之人",desc:"原残星会会监，后转为可玩角色。漂泊者曾失约于她，在彼岸索诺拉中揭示两人过去。擅长场外湮灭DPS，傀儡赫卡忒进行毁灭性持续攻击。与漂泊者关系最为复杂——亦敌亦友。",element:"湮灭",weapon:"音感仪",rarity:"5★",ver:"2.5"},

let selectedNode=null;
network.on("click",function(p){if(p.nodes.length>0)selectNode(p.nodes[0]);else deselectNode();});
network.on("doubleClick",function(p){if(p.nodes.length>0)network.focus(p.nodes[0],{scale:1.8,animation:{duration:600,easingFunction:"easeInOutQuad"}});});

function selectNode(nodeId){
  if(selectedNode===nodeId)return;
  selectedNode=nodeId;
  const char=nodes.get(nodeId);
  const connEdges=network.getConnectedEdges(nodeId);
  const connNodes=network.getConnectedNodes(nodeId);
  nodes.update(nodes.getIds().map(id=>{
    const isSel=id===nodeId,isCon=connNodes.includes(id),c=nodes.get(id);
    return{id,opacity:isSel||isCon?1:0.1,size:isSel?c.size*1.8:isCon?c.size*1.25:c.size,borderWidth:isSel?6:isCon?3:1};
  }));
  edges.update(edges.getIds().map(id=>{
    const isCon=connEdges.includes(id),e=edges.get(id);
    return{id,width:isCon?(e.width||1.2)*1.6:0.15,color:{color:isCon?(e.color?.color||"#888"):"#1a1a20",highlight:isCon?"#fff":"#1a1a20",hover:isCon?"#fff":"#1a1a20"},font:{size:isCon?10:0,color:isCon?"#fff":"#1a1a20",strokeWidth:0,align:"middle"}};
  }));
  updateCharInfo(char,connNodes);
}

function deselectNode(){
  selectedNode=null;
  nodes.update(nodes.getIds().map(id=>{const c=nodes.get(id);return{id,opacity:1,size:c._os||c.size,borderWidth:2.5};}));
  edges.update(edges.getIds().map(id=>{const e=edges.get(id);return{id,width:e._ow||e.width||1.2,color:{color:e._oc||e.color?.color||"#888",highlight:"#fff",hover:"#fff"},font:{size:7,color:e._ol||"#888",strokeWidth:0,align:"middle"}};}));
  document.getElementById("placeholder").style.display="block";
  document.getElementById("charInfo").querySelectorAll(".card").forEach(el=>el.remove());
}
nodes.forEach(n=>{n._os=n.size;});
edges.forEach(e=>{e._ow=e.width;e._oc=e.color?.color;e._ol=e.font?.color;});

function updateCharInfo(char,cIds){
  document.getElementById("placeholder").style.display="none";
  const infoEl=document.getElementById("charInfo");
  infoEl.querySelectorAll(".card").forEach(el=>el.remove());
  const gc=groupColors[char.group]||{bg:"#666",border:"#888"};
  const conns=cIds.map(id=>nodes.get(id));
  const cEdges=cIds.map(id=>{
    const eids=network.getConnectedEdges(char.id);
    return eids.map(eid=>edges.get(eid)).find(e=>(e.from===char.id&&e.to===id)||(e.to===char.id&&e.from===id));
  }).filter(Boolean);
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`
    <div class="name" style="color:${gc.border}">${char.label}</div>
    <div class="title-line">${char.title} · ${char.element} · ${char.weapon} <span style="color:${gc.border}">${char.rarity}</span></div>
    <div class="tags">
      <span style="color:${gc.border};border-color:${gc.border}40;background:${gc.border}15;">${char.group}</span>
      <span style="color:#8b90a0;border-color:#8b90a040;background:#8b90a015;">${char.element}</span>
      <span style="color:#8b90a0;border-color:#8b90a040;background:#8b90a015;">v${char.ver}</span>
    </div>
    <div class="desc">${char.desc}</div>
    <h4>&#9654; 关系网络 (${conns.length})</h4>
    <ul class="relation-list">
      ${conns.map((c,i)=>{const edge=cEdges[i],rt=edge?edge.label||"关联":"关联",rc=edge?(edge.color?.color||"#888"):"#888";return`<li onclick="selectNode('${c.id}')"><span class="rel-dot" style="background:${groupColors[c.group]?.bg||'#666'}"></span><span>${c.label}</span><span class="rel-type" style="color:${rc}">${rt}</span></li>`;}).join("")}
    </ul>`;
  infoEl.appendChild(card);
}

// ==================== 搜索 ====================
document.getElementById("searchInput").addEventListener("input",function(e){
  const q=e.target.value.trim();if(!q){deselectNode();return;}
  const m=characters.find(c=>c.label.includes(q)||c.id.includes(q));
  if(m){selectNode(m.id);network.focus(m.id,{scale:1.5,animation:{duration:400,easingFunction:"easeInOutQuad"}});}
});

function resetNetwork(){deselectNode();network.fit({animation:{duration:600,easingFunction:"easeInOutQuad"}});document.getElementById("searchInput").value="";}
window.addEventListener("resize",()=>network.fit({animation:false}));
setTimeout(()=>network.fit({animation:false}),600);
</script>
</body>
